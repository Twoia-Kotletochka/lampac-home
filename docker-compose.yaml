name: lampac

services:
  lampac:
    image: ghcr.io/lampac-nextgen/lampac
    container_name: lampac
    network_mode: host
    dns:
      - ${LAMPAC_DNS:-1.1.1.1}
    environment:
      LAMPAC_STARTUP_CHECK_HOST: ${LAMPAC_STARTUP_CHECK_HOST:-connectivitycheck.gstatic.com}
      LAMPAC_STARTUP_CHECK_URL: ${LAMPAC_STARTUP_CHECK_URL:-http://connectivitycheck.gstatic.com/generate_204}
      LAMPAC_STARTUP_WAIT_SECONDS: ${LAMPAC_STARTUP_WAIT_SECONDS:-60}
    entrypoint:
      - /usr/bin/sh
      - /lampac/startup-wait.sh
    command:
      - /usr/share/dotnet/dotnet
      - Core.dll
    restart: unless-stopped
    shm_size: 1024mb
    logging:
      options:
        tag: "{{.Name}}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS --max-time 5 http://127.0.0.1:9118/ts/echo | grep -q '^MatriX' &&
          curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:9118/ &&
          curl -fsS --max-time 5 http://127.0.0.1:9118/api/v1.0/conf | grep -q apikey
      interval: 2m
      timeout: 20s
      start_period: 240s
      start_interval: 5s
      retries: 3
    volumes:
      - ./lampac-startup-wait.sh:/lampac/startup-wait.sh:ro
      - ./lampac-docker/config/passwd:/lampac/passwd
      - ./lampac-docker/config/init.conf:/lampac/init.conf
      - ./lampac-docker/plugins/unlock.js:/lampac/wwwroot/unlock.js
      # свой плагин украинского IPTV (каналы встроены)
      - ./lampac-docker/plugins/uatv.js:/lampac/wwwroot/uatv.js
      # правленый lampainit.js: настройка парсера при каждом запуске (нативная сборка)
      - ./lampac-docker/plugins/lampainit.js:/lampac/module/LampaWeb/plugins/lampainit.js
      # правленый on.js: inline-разблокировка демо-режима + парсер (магазинная сборка)
      - ./lampac-docker/plugins/on.js:/lampac/module/LampaWeb/plugins/on.js
      - ./lampac-docker/database:/lampac/database
      - ./cache:/lampac/cache
      - ./data/ts:/lampac/data/ts
      - ./data/dlna:/lampac/data/dlna
